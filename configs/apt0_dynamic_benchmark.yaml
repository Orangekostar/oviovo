# ============================================================
# OVIOVO Default Configuration
# Online Open-Vocabulary Instance-First Dynamic Mapping
# ============================================================

# --- Frame Input ---
frame_input:
  image_height: 480            # 输入图像高度；主要用于占位/默认配置，真实数据可由数据集适配器覆盖
  image_width: 640             # 输入图像宽度；主要用于占位/默认配置，真实数据可由数据集适配器覆盖

# --- Proposal Module ---
proposal:
  backend: "placeholder"        # "placeholder" | "sam2" | "esam" | "entitysam" | "cropformer" | "precomputed"
  min_mask_area: 100            # 原始 proposal 的最小像素面积；低于该值的小碎片会被直接丢弃
  max_proposals: 50             # 每帧最多保留的 proposal 数；用于限制前端输出规模和后续计算量
  confidence_threshold: 0.5     # proposal 置信度下限；低于该分数的掩码不进入后续流程
  sam2:
    device: "cuda"              # SAM2 推理设备；通常是 cuda
    sam_version: "2.1"          # SAM2 版本号；用于拼接配置和权重文件名
    sam_encoder: "hiera_l"      # SAM2 编码器规格；当前默认大模型用于对比
    sam_ckpt_path: "data/input/sam_ckpts"  # SAM2 checkpoint 根目录
    points_per_side: 16         # 自动 mask 采样密度；越大召回越高但更慢
    nms_iou_th: 0.8             # SAM2 内部 proposal 去重的 IoU 阈值
    stability_score_th: 0.95    # SAM2 稳定性分数阈值；越高越保守
    min_mask_region_area: 100   # SAM2 内部保留的最小 mask 区域
    use_m2m: false              # 是否启用 SAM2 的 mask-to-mask 模式
  esam:
    device: "cuda"              # E-SAM 推理设备
    repo_root: "/home/phl/vv/E-SAM"  # 本地 E-SAM 仓库根目录
    python_paths: []            # 额外添加到 sys.path 的本地路径
    factory: ""                 # 推荐：module:function，返回可调用 predictor
    predictor: ""               # 备用：直接指向可调用 predictor 或工厂
    predictor_is_factory: false # 若 predictor 指向工厂函数，置为 true
    call_mode: "auto"           # auto | rgb | rgbd | kwargs
    bbox_format: "auto"         # auto | xywh | xyxy（解析原始 bbox）
    config_path: ""             # E-SAM 配置路径（可选）
    checkpoint_path: ""         # E-SAM 权重路径（可选）
    max_proposals: 64
    confidence_threshold: 0.0
  entitysam:
    device: "cuda"              # EntitySAM 推理设备
    repo_root: "/home/phl/vv/paper2/entitysam"  # 本地 EntitySAM 仓库根目录
    sequence_dir: ""            # RGB 帧目录；视频型 EntitySAM 前端必须显式知道整段序列
    config_path: "configs/sam2.1_hiera_l.yaml"   # Hydra 模型配置名（相对于 EntitySAM 的 sam2 包根目录）
    checkpoint_path: "checkpoints/vit-l/model_0009999.pth"  # 训练权重路径（相对于 repo_root）
    mask_decoder_depth: 8       # EntitySAM 论文默认 ViT-L 解码深度
    points_per_side: 16         # 自动 mask 采样密度
    nms_iou_th: 0.8             # proposal 去重 IoU 阈值
    stability_score_th: 0.95    # 稳定性分数阈值
    min_mask_region_area: 100   # 最小 mask 区域
    mask_binary_threshold: 0.5  # 将 EntitySAM 输出 logits 二值化成 mask 的阈值
    object_mask_threshold: 0.05 # 每帧保留 query 的最低分数门槛
    topk_per_frame: 100         # 每帧最多参与筛选的 query 数
    use_m2m: false              # 是否启用 mask-to-mask 模式
    max_proposals: 64
    confidence_threshold: 0.0
  cropformer:
    device: "cuda"              # CropFormer 推理设备；若本机无环境可改为 cpu 做接线验证
    python_paths: []            # 需要额外加入 sys.path 的本地仓库路径列表
    factory: ""                 # 可选的自定义 predictor 工厂，格式 module:function
    config_hooks: []            # detectron2 风格配置 hook，格式 module:function
    config_path: ""             # CropFormer/Detectron2 配置文件路径
    checkpoint_path: ""         # CropFormer 权重路径
    input_format: "BGR"         # 输入给 detectron2 predictor 的颜色顺序
    score_threshold: 0.5        # CropFormer 自身输出阈值
    max_detections: 100         # CropFormer 每帧最多检测数
  precomputed:
    cache_dir: ""               # frontend proposal cache 根目录；包含 manifest.json 和 frames/
    manifest_path: ""           # 可选：显式指定 manifest.json；为空时默认使用 cache_dir/manifest.json
    strict: true                # 若 manifest 缺失或 frame 不在 manifest 内，是否直接报错

# --- Detector Anchors ---
anchor_frontend:
  enabled: false
  use_boxes_as_primary_proposals: true
  use_sam_intersection_proposals: true
  prefer_largest_covering_box: true
  # semantic_vote keeps SAM masks unchanged and uses anchors only as semantic votes.
  # largest_covering and preserve_nested_classes are compatibility modes that may union masks.
  assignment_policy: "largest_covering"
  preserve_nested_classes: false
  clip_sam_masks_to_anchor_box: false
  preserve_cross_class_nested: false
  subtract_cross_class_child_mask_from_parent: false
  min_anchor_mask_coverage: 0.20
  min_protected_anchor_confidence: 0.25
  backend: "yoloworld"
  device: "cuda:0"
  model_path: "/home/phl/vv/yolov8s-world.pt"
  python_executable: "/home/phl/anaconda3/envs/dualmap/bin/python"
  confidence_threshold: 0.2
  max_detections: 128
  iou_assign_threshold: 0.2
  keepalive_iou_threshold: 0.1
  center_assign_enabled: true
  keepalive_center_inside: true
  unanchored_fallback_enabled: false
  proposal_min_area: 25
  covering_min_proposal_coverage: 0.85
  # Prevent small SAM masks fully inside a much larger YOLO box from inheriting the parent label.
  contained_subproposal_gate_enabled: true
  contained_max_anchor_coverage: 0.20
  contained_min_proposal_coverage: 0.85
  scale_compatible_min_anchor_coverage: 0.20
  scale_compatible_min_bbox_iou: 0.10
  classes:
    - chair
    - table
    - cabinet
    - sofa
    - bed
    - plant
    - monitor
    - lamp
    - shelf
    - stool
    - nightstand

# --- Runtime Visual Consolidation ---
runtime_vis:
  enabled: true
  merge_score_threshold: 0.65   # 两个 raw mask 最终允许合并的总分阈值；越高越保守
  base_score_floor: 0.35        # 纯当前帧几何支持的最低门槛；低于该值时即使有历史 prior 加分也不允许硬并
  lambda_whole_prior: 1.5       # whole-object prior 的加权系数；越大表示历史完整观测对合并的影响越强
  bbox_gap_px: 30               # 计算 2D 邻接分数时允许的框间距参考尺度；间隔越大邻接分越低
  depth_mean_diff_max: 0.18     # 认为两个 mask 深度连续的最大平均深度差（米）；超过后连续性快速下降
  prior_depth_diff_max: 0.25    # mask 与历史 object prior 深度仍算兼容的最大差值（米）
  plane_similarity_diff_max: 0.15  # 两个局部深度平面趋势仍算相近的最大差异；用于建边前筛选
  bbox_fill_ratio_ref: 0.55     # 合并后 bbox 的合理填充率参考值；填充率太低说明“并起来像空框”
  expanded_prior_bbox_scale: 1.15  # 历史 object prior 投影到当前帧后再向外扩张的比例；给姿态/投影误差留容忍度
  recent_history_size: 10       # whole-object prior 的时间衰减窗口（帧）；越旧的对象证据权重越低
  min_group_area: 120           # 运行期合并后的 group 最小面积参考值；当前主要作为配置保留，便于后续显式过滤
  edge_admission_min_adjacency: 0.55        # 建边门槛之一：2D 邻接分至少达到该值，两个 mask 才允许进入图
  edge_admission_min_depth_continuity: 0.55 # 建边门槛之一：深度连续性至少达到该值才允许连边
  edge_admission_min_plane_similarity: 0.60 # 建边门槛之一：局部平面趋势相似度至少达到该值才允许连边
  edge_admission_min_whole_prior: 0.65      # 建边门槛之一：若共享同一历史 object prior，加分至少达到该值才可放宽连边
  small_object_area_threshold: 1200         # 小物体保护面积阈值（像素）；小于该面积的 mask 会进入“避免被吞并”逻辑
  small_object_depth_gap_min: 0.12          # 小物体与邻近大区域之间被视为“明显分层”的最小深度差（米）
  small_object_bbox_plausibility_margin: 0.08  # 若合并后 bbox 合理性比独立解释差超过该裕量，就认为吞并风险偏高
  small_object_protection_threshold: 0.60      # 小物体保护分超过该值时，优先拒绝仅靠弱几何证据的吞并
  small_object_protection_penalty: 0.25        # 小物体保护对最终合并门槛的额外惩罚；越大越不容易吞并小目标
  semantic_class_merge_gate_enabled: false     # true 时不同 anchor class 的 proposal 不在 RuntimeVis 内合并

  mu_background_conflict: 1.35   # 背景冲突项的放大系数；越大越容易因为“更像背景”而压制 object merge
  depth_edge_threshold: 0.05     # runtime_vis 内部若使用深度边界辅助判别时的边缘阈值（米）
  object_like_threshold: 0.55    # 某候选更偏 object 的最低分数阈值；高于此值可认为具备目标属性
  background_like_threshold: 0.62  # 某候选更偏 background 的最低分数阈值；高于此值会更倾向拒绝 object 合并
  class_margin: 0.08             # object-like 与 background-like 分数之间要求拉开的最小间隔；太接近则视为不确定
  uncertain_objectness_min: 0.45 # 不确定区域仍保留为 object 候选的最低下限；低于此值更可能被过滤
  background_conflict_reject_threshold: 0.62  # 背景冲突分达到该阈值时，直接拒绝该合并/归并假设
  background_planar_residual_ref: 0.02        # 判断“更像大背景平面”时的平面残差参考值（米）；越小越平
  background_low_variance_ref: 0.006          # 判断“更像背景表面”时的低深度方差参考值；越小越稳定
  background_large_extent_ref: 0.18           # 判断“更像背景大区域”时的覆盖尺度参考值；越大越偏背景
  object_depth_variance_ref: 0.012            # 判断“更像独立物体”时允许的深度方差参考值；用于区分平面背景和立体目标
  object_edge_density_ref: 0.45               # 判断“更像物体轮廓”时的边界密度参考值；边界越丰富越偏物体
  small_swallow_area_ratio: 0.22              # 小物体被吞并时允许的小/大面积比例上限；过小通常更应保护
  min_boundary_depth_points: 6                # 评估边界深度连续性时至少需要的有效深度点数量；太少则证据不足

  max_plane_fit_points: 256        # 深度平面拟合时最多采样的点数；用于限制运行时开销

# --- Depth Refinement ---
depth_refinement:
  enabled: true
  depth_edge_threshold: 0.05    # 深度边缘阈值（米）；边缘越强越会把 mask 边缘裁掉
  min_mask_area_after_refine: 50  # refinement 后允许保留的最小 mask 面积；过小的残片直接丢弃
  protected_anchor_keepalive_enabled: true
  keepalive_objectness_floor: 0.58

# --- Patch Lifting ---
patch_lifting:
  min_points: 10                # 2D mask 回投后最少需要的 3D 点数；低于该值不值得当作有效 patch
  voxel_size: 0.02              # 3D 点云下采样体素尺寸（米）；越大越稀疏
  foreground_depth_filter:
    enabled: true
    front_quantile: 0.05
    depth_band: 0.08
    min_component_points: 10
    min_depth_gap: 0.15
    max_removed_ratio: 0.50

# --- Background / Object Split ---
bg_obj_split:
  height_threshold: 0.1         # objects below this height treated as floor
  size_threshold: 5000          # patches above this point count are likely background
  ambiguity_overlap: 0.3        # overlap ratio for ambiguous classification

# --- Object Association ---
association:
  centroid_distance_weight: 0.4  # 关联总分里“质心距离”项的权重；越大越偏空间邻近匹配
  bbox_overlap_weight: 0.3       # 关联总分里“3D bbox 重叠”项的权重
  geometry_overlap_weight: 0.2   # 关联总分里“几何点云重叠”项的权重
  pose_proximity_weight: 0.1     # 关联总分里“位姿接近”项的权重
  match_threshold: 0.5          # minimum score to accept association
  observation_identity_gate_enabled: true
  observation_identity_min_patch_confidence: 0.35
  semantic_conflict_gate_enabled: false
  semantic_conflict_min_patch_confidence: 0.35
  semantic_conflict_min_object_confidence: 0.35
  semantic_conflict_subregion_point_ratio: 0.35
  semantic_conflict_subregion_volume_ratio: 0.35

# --- Object Update ---
object_update:
  contested_residual_pool:
    enabled: true
  downsample_voxel_size: 0.02    # object 局部点云重采样体素尺寸（米）；控制对象几何密度
  downsample_interval: 5        # re-downsample every N updates
  max_points_per_object: 10000   # 单个 object 最多保留的点数；防止局部几何无限膨胀
  surface_owner_gate:
    enabled: true
    background_enabled: true
    min_accept_points: 20
    min_update_accept_ratio: 0.30
    min_new_object_accept_ratio: 0.55
    max_foreign_owner_ratio: 0.25
    max_background_owner_ratio: 0.35
    attached_surface_classes: [switch, wall-plug, vent]
    attached_max_voxels: 40
    self_background_min_score: 0.65
    self_background_margin: 0.15
  current_frame_visibility_gate:
    enabled: true
    distance_threshold: 0.05
    min_accept_points: 20
    min_accept_ratio: 0.30
  provisional_pool:
    enabled: false
    match_distance: 0.35
    promotion_hits: 3
    max_idle_frames: 30
    downsample_voxel_size: 0.02
    max_points_per_object: 6000
    unanchored_objectness_min: 0.75
    unanchored_min_points: 128

# --- Dual Map ---
dual_map:
  enabled: false
  active_radius: 3.0
  warm_ttl_frames: 60
  cold_ttl_frames: 180
  dense_surface_voxel: 0.02
  dense_surface_cap_per_object: 4000

# --- Semantic Memory ---
semantic_memory:
  backend: "placeholder"        # "placeholder" | "siglip" | "clip"
  feature_dim: 512               # 语义特征维度；需与实际语义后端输出一致
  top_k_labels: 5                # 每个对象最多保留的标签候选数量
  confidence_decay: 0.95         # 历史语义置信度的衰减系数；越小越强调新观测
  min_observations_for_label: 3  # 某标签至少观测多少次后才适合作为稳定标签
  anchor_commit:
    min_frame_hits: 2
    min_high_quality_hits: 1
    min_weighted_score: 1.0
    min_score_margin: 0.15
    provisional_export_fallback: false
  anchor_export:
    enabled: true
    min_frame_hits: 1
    min_high_quality_hits: 1
    min_weighted_score: 0.75
    min_score_margin: 0.05
    min_confidence: 0.75
    min_view_quality: 0.25
    allow_single_frame_high_confidence: true
    single_frame_min_confidence: 0.90
    single_frame_min_view_quality: 0.50

# --- Background Update ---
background_update:
  voxel_size: 0.05               # 背景点云/体素地图的体素尺寸（米）；越大越粗糙、越省内存
  truncation_distance: 0.1      # TSDF truncation
  min_weight: 1.0                # 背景融合时的最小权重门槛；太低的观测不值得写入

# --- Dynamic Maintenance ---
dynamic_maintenance:
  # Check frequency
  lifecycle_check_interval: 10

  # TSDF-driven disappearance
  disappear_threshold: 0.2           # ownership_ratio below this triggers DISAPPEARED

  # Grace period for new objects
  creation_grace_frames: 5           # skip judgment for objects younger than this

  # MOVED detection
  moved_centroid_threshold: 0.3      # minimum centroid shift to consider MOVED (m)
  moved_search_steps: 10             # direction sampling steps along shift vector
  moved_ownership_skew: 0.6          # new_half / total > this confirms MOVED

  # CandidateEvidenceGrid
  candidate_cluster_radius: 0.3      # voxel cluster radius for candidate aggregation (m)
  candidate_promotion_threshold: 3.0 # cumulative confidence to trigger promotion
  candidate_max_idle_frames: 60      # expire entries unseen for this many frames

# --- Pipeline ---
pipeline:
  log_interval: 1               # log every N frames
  verbose: true

# --- Logging ---
logging:
  level: "INFO"
  log_file: ""                  # empty = console only
