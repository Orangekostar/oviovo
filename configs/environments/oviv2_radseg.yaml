name: oviovo-radseg
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.15
  - pytorch=2.4.0
  - torchvision=0.19.0
  - pytorch-cuda=12.1
  - pyg::pytorch-scatter=2.1.2=py311_torch_2.4.0_cu121
  - pip=26.1.2
  # Conda writes its temporary pip requirements beside this YAML, so this
  # nested requirements path is relative to configs/environments/.
  - pip:
      - -r oviv2_radseg_pip.lock.txt
